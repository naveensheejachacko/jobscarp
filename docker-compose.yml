services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobauto
      POSTGRES_PASSWORD: jobauto
      POSTGRES_DB: jobauto
    ports:
      - "5433:5432"  # host 5433 -> avoids clashing with a local Postgres on 5432
    volumes:
      - jobauto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobauto:jobauto@db:5432/jobauto
    ports:
      - "8000:8000"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./profile.yaml:/app/profile.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  jobauto_pgdata:
